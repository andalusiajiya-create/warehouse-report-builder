<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse Report Builder</title>
<style>
:root{--bg:#eef0f3;--panel:#fff;--ink:#1c2433;--mute:#667085;--line:#d8dce3;--acc:#2f9e33;--accbg:#e8f5e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--panel:#1d232d;--ink:#e8ebf0;--mute:#9aa3b2;--line:#323a47;--acc:#4cc152;--accbg:#223a26}}
:root[data-theme="dark"]{--bg:#14181f;--panel:#1d232d;--ink:#e8ebf0;--mute:#9aa3b2;--line:#323a47;--acc:#4cc152;--accbg:#223a26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:400px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
.side h1{font-size:16px;margin:0 0 4px}
.side p{margin:0 0 12px;color:var(--mute);font-size:12.5px}
.add{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px;display:inline-block}
button:hover,.btn:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);width:100%;padding:10px;font-weight:600;margin-bottom:6px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.tools button{flex:1;font-size:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.card header{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.card header b{flex:1;font-size:12.5px;color:var(--acc)}
.card header button{padding:2px 8px;font-size:12px}
label{display:block;font-size:11.5px;color:var(--mute);margin:6px 0 2px}
label.ck{display:flex;gap:6px;align-items:center;color:var(--ink)}
input[type=text],textarea,select{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.ph{display:grid;grid-template-columns:48px 1fr auto;gap:6px;align-items:center;margin-top:6px}
.ph img{width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.ph div{display:flex;gap:2px}.ph button{padding:2px 6px;font-size:12px}
.gr{overflow:auto;margin-top:6px}.gr table{border-collapse:collapse}.gr td{padding:0}.gr input[type=text]{width:112px;padding:3px 5px;font-size:12px;border-radius:0}.gr tr:first-child input{font-weight:700}.gb{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.gb button{padding:2px 8px;font-size:12px}
.pb{height:0;border-top:1px dashed #b8c4b8;margin:20px 0;position:relative}
.pb::after{content:"halaman baru";position:absolute;right:0;top:-8px;font-size:9px;color:#8a9a8a;background:#fff;padding:0 4px}
.dt{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}.dt summary{cursor:pointer;font-size:12px;color:var(--mute)}
.st{font-size:12px;color:var(--mute);margin-top:4px}
.stage{padding:24px;overflow:auto}
.paper{width:210mm;max-width:100%;min-height:297mm;margin:0 auto;background:#fff;color:#232f3e;padding:0;box-shadow:0 2px 14px rgba(0,0,0,.2);font:12.5px/1.6 Arial,Helvetica,sans-serif}
.paper .sub{font-size:13px;font-weight:400;color:#5d6673;margin:8px 0 0}
.paper h2{font-size:16px;font-weight:700;margin:34px 0 14px;padding:10px 16px;background:#eef6e3;border-left:4px solid #7ab51d;border-radius:0 4px 4px 0;color:#232f3e;break-after:avoid}
.paper h3{font-size:13px;font-weight:700;margin:24px 0 10px;padding:7px 14px;background:#f5faee;border-left:3px solid #a9d16a;border-radius:0 4px 4px 0;color:#232f3e;break-after:avoid}
.paper p{margin:10px 0;white-space:pre-wrap;color:#222;line-height:1.7}
.wrap{width:100%;border-collapse:collapse}
.paper table.wrap>thead>tr>td,.paper table.wrap>tbody>tr>td,.paper table.wrap>tfoot>tr>td{padding:0;border:0;background:none;vertical-align:top}
.bar{height:5mm;background:#7ab51d}
.runhd{display:flex;justify-content:space-between;align-items:center;padding:6mm 20mm 7mm;font-size:11px;color:#7e8490}
.logo-img{height:11mm;width:auto;display:block}
.logo{font-size:17px;font-weight:800;letter-spacing:.02em}.logo i{font-style:normal;color:#232f3e}.logo b{color:#7ab51d}
.bd{padding:6mm 20mm 10mm}
.fline{margin:0 20mm;border-top:1px solid #d1d5db;height:1px}
.runft{display:flex;justify-content:space-between;padding:8px 20mm 16px;font-size:10px;color:#7e8490}
.paper .hd{background:#e6f1d6;border-left:6px solid #7ab51d;border-radius:0 6px 6px 0;padding:20px 24px;margin:0 0 6px}
.paper h1{font-size:24px;font-weight:800;color:#232f3e;margin:0;text-transform:uppercase;line-height:1.2}
.bd table{border-collapse:collapse;width:100%;margin:12px 0 22px}
.bd th,.bd td{padding:11px 13px;text-align:left;vertical-align:top;font-size:11.5px;line-height:1.5;border:0;border-bottom:1px solid #d1d5db}
.bd th{background:#232f3e;color:#fff;font-weight:700;border-bottom:0}
.bd tbody tr:nth-child(even){background:#f3f4f6}
.bd tr{break-inside:avoid}
.bd table.kv tbody tr:nth-child(odd){background:#f3f4f6}.bd table.kv tbody tr:nth-child(even){background:none}
.bd table.kv td:first-child{font-weight:700;color:#232f3e;width:32%}
.paper h1.lh{margin:2mm 0 8px;background:#e6f1d6;border-left:6px solid #7ab51d;border-radius:0 6px 6px 0;padding:16px 24px}
.sl{list-style:none;margin:12px 0 18px;padding:0}
.sl li{position:relative;padding:8px 0 8px 22px;border-bottom:1px solid #d1d5db;line-height:1.5}
.sl li::before{content:"";position:absolute;left:4px;top:16px;width:7px;height:7px;border-radius:50%;background:#7ab51d}
.note{background:#fff8e1;border:1px solid #f0b400;border-left-width:3px;padding:14px 18px;margin:20px 0;break-inside:avoid}
.note b.t{display:block;color:#8a5a00;margin-bottom:4px;font-size:12.5px}
.cap{font-size:16px;font-weight:700;margin:34px 0 14px;padding:10px 16px;background:#eef6e3;border-left:4px solid #7ab51d;border-radius:0 4px 4px 0;color:#232f3e;break-after:avoid}
.grid{display:grid;gap:24px 18px;margin:14px 0 22px}
.cell{break-inside:avoid;display:flex;flex-direction:column}
.cell .im{flex:1;background:#f3f4f6;border:1px dashed #cfd3da;display:flex;align-items:center;justify-content:center;padding:6px}
.cell img{max-width:100%;max-height:var(--ih,110mm);object-fit:contain;display:block}
.cell span{display:block;font-size:10px;line-height:1.5;color:#7e8490;margin-top:8px;text-align:left}
.empty{color:#999;font-style:italic}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.stage{padding:10px}}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .runft{display:none}.bd{padding-bottom:0}.bd>:last-child{margin-bottom:0}.pb{border:0;margin:0;break-before:page}.pb::after{display:none}
 body{background:#fff}.side{display:none}.app{display:block}
 .stage{padding:0;overflow:visible}
 .paper{box-shadow:none;width:auto;min-height:0;margin:0;padding:0}
 :root{padding:0}
}
</style>
<style id="pg">@page{size:A4;margin:0 0 16mm}</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <h1>Warehouse Report Builder</h1>
  <p>Susun laporan dari blok, upload foto, lalu simpan jadi PDF. Isi laporan otomatis tersimpan di browser ini.</p>
  <button class="pri" id="print">Simpan sebagai PDF</button>
  <div class="st" style="margin-bottom:12px">Di dialog print: pilih "Save as PDF", matikan "Headers and footers". Kalau tombol tidak jalan, tekan Ctrl+P.</div>
  <div class="add" id="add"></div>
  <div class="tools"><button id="newr">Laporan baru</button><button id="clrp">Hapus semua foto</button></div>
  <div id="editor"></div>
 </aside>
 <main class="stage"><article class="paper" id="paper"></article></main>
</div>

/* storage: IndexedDB (muat banyak foto), semua dibungkus try/catch */
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((ok,no)=>{try{const r=indexedDB.open('wrb',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});return dbp}
async function save(){try{const d=await db();d.transaction('s','readwrite').objectStore('s').put(blocks,'blocks')}catch(e){}}
async function load(){try{const d=await db();return await new Promise(ok=>{const r=d.transaction('s').objectStore('s').get('blocks');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}}

function cells(l){return l.includes('\t')?l.split('\t'):l.split(',')}
const idre=/\b[A-Za-z]{2,6}[_-]?\d{6,}\b/;
function splitId(c){
 const m=c.match(idre);if(!m)return [c];
 const i=c.indexOf(m[0]),bf=c.slice(0,i).trim(),af=c.slice(i+m[0].length).trim();
 return [...(bf?[bf]:[]),m[0],...(af?af.split(/\s{2,}/):[])];
}
function splitRow(l,sp){
 if(l.includes('\t'))return l.split('\t').flatMap(splitId).flatMap(c=>String(c).trim().split(/\s{2,}/));
 if(/ \| /.test(l))return l.split('|');
 if(sp)return l.trim()?l.trim().split(/\s+/):null;
 if(idre.test(l))return splitId(l);
 const w=l.trim().split(/\s+/);
 if(w.length>1&&w.every(x=>/^\+?\d{6,}$/.test(x)))return w;
 return null;
}
function cols(b){
 let m=b.g&&b.g[0]?b.g[0].length:0;
 for(const l of String(b.body||'').split('\n')){const r=splitRow(l,b.sp);if(r)m=Math.max(m,r.length)}
 return m;
}
const hn=b=>cols(b)?(b.hv&&b.hv.length?b.hv.length:cols(b)):0;
const hdArr=b=>{const v=b.hv||[];if(!v.some(x=>x&&x.trim()))return null;return Array.from(v,x=>x||'')};
function hdInputs(b,i){
 const n=hn(b);
 if(!n)return '<div class="st">Judul kolom: kotak isiannya muncul di sini setelah ada tabel (dari paste Excel/Sheets, baris dengan Terminal ID, atau tombol Tambah tabel).</div>';
 return '<label>Judul kolom tabel (opsional, isi per kolom)</label><div class="gr"><table><tr>'+Array.from({length:n},(_,x)=>`<td><input type="text" data-i="${i}" data-hv="${x}" value="${esc((b.hv||[])[x]||'')}" placeholder="Kolom ${x+1}" aria-label="Judul kolom ${x+1}"></td>`).join('')+`</tr></table></div><div class="gb"><button data-a="hc+" data-i="${i}">+ Kolom</button><button data-a="hc-" data-i="${i}">− Kolom</button></div>`;
}
function tbl(r,num,nh,hd,kv){
 const H=hd&&hd.length?hd:null;nh=nh||kv||r.length===1;
 let head=H||(nh?null:r[0]);let rows=(H||nh)?r:r.slice(1);
 const n=Math.max(head?head.length:0,...rows.map(x=>x.length));
 const pad=x=>Array.from({length:n},(_,k)=>x[k]==null?'':x[k]);
 rows=rows.map(pad);if(head)head=pad(head);
 const th=head?'<thead><tr>'+(num?'<th style="width:36px">No</th>':'')+head.map(c=>`<th>${esc(String(c).trim())}</th>`).join('')+'</tr></thead>':'';
 const tb=rows.map((x,i)=>`<tr>${num?`<td>${i+1}</td>`:''}${x.map(c=>`<td>${esc(String(c).trim())}</td>`).join('')}</tr>`).join('');
 return `<table${kv?' class="kv"':''}>${th}<tbody>${tb}</tbody></table>`;
}
function bodyHtml(b){
 let out='',para=[],tb=[],mr=[];
 const fp=()=>{if(para.length){out+=`<p>${rich(para.join('\n'))}</p>`;para=[]}};
 const ft=()=>{if(tb.length){if(b.g)mr.push(...tb);else out+=tbl(tb,b.num,b.nohead,hdArr(b),b.kv);tb=[]}};
 for(const l of String(b.body||'').split('\n')){
  const t=l.trim();
  const sr=splitRow(l,b.sp);
  if(sr){fp();tb.push(sr)}
  else if(!t){fp();ft()}
  else{ft();para.push(t)}
 }
 fp();ft();return {html:out,rows:mr};
}
function renderBlock(b,ctx){
 if(b.t==='sum'){
  const L=String(b.body||'').split('\n').map(x=>x.trim()).filter(Boolean);
  return `<h2>${esc(b.h||'Ringkasan Kegiatan')}</h2>`+(L.length?`<ul class="sl">${L.map(x=>`<li>${rich(x)}</li>`).join('')}</ul>`:'<p class="empty">Belum ada kegiatan.</p>');
 }
 if(b.t==='title')return `<div class="hd"><h1>${esc(b.title)||'Judul laporan'}</h1>${b.sub?`<div class="sub">${esc(b.sub)}</div>`:''}</div>`;
 if(b.t==='text'){
  let hd=b.pb?'<div class="pb"></div>':'';
  if(b.h){if(b.plain&&b.pb)hd+=`<h1 class="lh">${esc(b.h)}</h1>`;else if(b.plain)hd+=`<h3>${esc(b.h)}</h3>`;else{ctx.n++;hd+=`<h2>${ctx.n}. ${esc(b.h)}</h2>`}}
  const bh=bodyHtml(b);
  return hd+(bh.html||(b.g||b.h?'':'<p class="empty">Laporan kosong</p>'))+(b.g?tbl([...b.g,...bh.rows],b.num,b.nohead,hdArr(b),b.kv):'');
 }
 if(b.t==='note')return `<div class="note"><b class="t">${esc(b.h)}</b>${rich(b.body)}</div>`;
 if(b.t==='photos'){
  const p=b.p||[],c=b.cols||3;
  return (b.pb?'<div class="pb"></div>':'')+(b.h?(b.hn?(ctx.n++,`<h2>${ctx.n}. ${esc(b.h)}</h2>`):`<div class="cap">${esc(b.h)}</div>`):'')+(p.length?`<div class="grid" style="grid-template-columns:repeat(${c},1fr);--ih:${({1:'172mm',2:'118mm',3:'80mm',4:'60mm'})[c]||'110mm'}">${p.map((x,j)=>`<div class="cell${c==1?' w':''}"><div class="im"><img src="${x.s}" alt="${esc(x.c)}"></div><span>${esc(b.cn?'Foto '+(j+1)+'. '+x.c:x.c)}</span></div>`).join('')}</div>`:'<p class="empty">Belum ada foto, upload dari panel kiri</p>');
 }
 return '';
}
function paper(){
 const t=blocks.find(b=>b.t==='title')||{};
 const hl='RECHARGE',hr=t.title||'',fl='ReCharge - Dokumen Internal';
 const logo=`<img class="logo-img" src="${LOGO}" alt="${esc(hl)}">`;
 const ctx={n:0};
 $('#paper').innerHTML=`<table class="wrap"><thead><tr><td><div class="bar"></div><div class="runhd">${logo}<span>${esc(hr)}</span></div></td></tr></thead><tbody><tr><td><div class="bd">${blocks.map(b=>renderBlock(b,ctx)).join('')}</div></td></tr></tbody><tfoot><tr><td><div class="fline"></div></td></tr></tfoot></table><div class="runft"><span>${esc(fl)}</span><span>Halaman 1</span></div>`;
 const q=x=>String(x).replace(/["\\\n]/g,' ');
 $('#pg').textContent=`@page{size:A4;margin:0 0 16mm;@bottom-left{content:"${q(fl)}";font:9pt Arial;color:#7e8490;padding-left:20mm;padding-top:1mm;vertical-align:top;text-align:left}@bottom-right{content:"Halaman " counter(page);font:9pt Arial;color:#7e8490;padding-right:20mm;padding-top:1mm;vertical-align:top;text-align:right}}`;
 save();
}
function gridEd(b,i){
 if(!b.g)return `<div class="gb"><button data-a="gadd" data-i="${i}">+ Tambah tabel</button></div>`;
 const rows=b.g.map((r,y)=>`<tr>${r.map((c,x)=>`<td><input type="text" data-i="${i}" data-r="${y}" data-c="${x}" value="${esc(c)}" aria-label="Baris ${y+1} kolom ${x+1}"></td>`).join('')}</tr>`).join('');
 return `<label>Tabel (baris pertama = header, kecuali Judul kolom diisi). Bisa paste langsung dari Excel/Sheets ke sel mana pun</label><div class="gr"><table>${rows}</table></div><div class="gb"><button data-a="gr+" data-i="${i}">+ Baris</button><button data-a="gr-" data-i="${i}">− Baris</button><button data-a="gc+" data-i="${i}">+ Kolom</button><button data-a="gc-" data-i="${i}">− Kolom</button><button data-a="gdel" data-i="${i}">Hapus tabel</button></div>`;
}
function editor(){
 $('#editor').innerHTML=blocks.map((b,i)=>{
  const T=TYPES[b.t];
  let h=T.f.map(([k,l,kind])=>`<label>${l}</label>`+(kind==='t'?`<textarea data-i="${i}" data-k="${k}">${esc(b[k])}</textarea>`:`<input type="text" data-i="${i}" data-k="${k}" value="${esc(b[k])}">`)).join('');
  if(b.t==='text')h+=gridEd(b,i)+`<div id="hdc${i}">${hdInputs(b,i)}</div>`;
  if(T.ck)h+=T.ck.map(([k,l])=>`<label class="ck"><input type="checkbox" data-i="${i}" data-k="${k}" ${b[k]?'checked':''}> ${l}</label>`).join('');
  if(T.photos){
   h+=`<label>Jumlah kolom foto</label><select data-i="${i}" data-k="cols">${[1,2,3,4].map(n=>`<option value="${n}" ${(b.cols||3)==n?'selected':''}>${n}${n==1?' kolom (paling besar)':n==2?' kolom (besar)':n==3?' kolom':' kolom (kecil)'}</option>`).join('')}</select>`;
   h+=`<label>Upload foto (bisa pilih banyak sekaligus)</label><input type="file" accept="image/*" multiple data-up="${i}"><div class="st" id="st${i}">${(b.p||[]).length} foto</div>`;
   h+=(b.p||[]).map((x,j)=>`<div class="ph"><img src="${x.s}" alt=""><input type="text" data-i="${i}" data-j="${j}" value="${esc(x.c)}"><div><button data-a="pup" data-i="${i}" data-j="${j}" aria-label="Naik">↑</button><button data-a="pdn" data-i="${i}" data-j="${j}" aria-label="Turun">↓</button><button data-a="pdel" data-i="${i}" data-j="${j}" aria-label="Hapus foto">✕</button></div></div>`).join('');
  }
  return `<section class="card"><header><b>${T.n}</b>${b.t==='title'?'':`<button data-a="up" data-i="${i}" aria-label="Naik">↑</button><button data-a="dn" data-i="${i}" aria-label="Turun">↓</button><button data-a="del" data-i="${i}" aria-label="Hapus blok">✕</button>`}</header>${h}</section>`}).join('')||'<p>Belum ada blok.</p>';
}
function all(){editor();paper()}

/* foto: perkecil dulu supaya PDF dan penyimpanan tidak berat */
function shrink(file){return new Promise(ok=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=2000,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.88))};im.onerror=()=>{URL.revokeObjectURL(u);ok(null)};im.src=u})}
async function upload(i,files){
 const b=blocks[i];b.p=b.p||[];const fs=[...files].sort((a,c)=>a.name.localeCompare(c.name,undefined,{numeric:true}));
 for(let n=0;n<fs.length;n++){
  const st=$('#st'+i);if(st)st.textContent=`Memproses ${n+1}/${fs.length}...`;
  const s=await shrink(fs[n]);if(s)b.p.push({s,c:fs[n].name.replace(/\.[^.]+$/,'')});
 }
 all();
}

$('#add').innerHTML=Object.entries(TYPES).filter(([k])=>k!=='title').map(([k,v])=>`<button data-add="${k}">+ ${v.n}</button>`).join('');
$('#add').onclick=e=>{const k=e.target.dataset.add;if(!k)return;const nb=k==='photos'?{t:k,cols:3,p:[]}:k==='sum'?{t:k,h:'Ringkasan Kegiatan'}:{t:k};if(k==='sum')blocks.splice(1,0,nb);else blocks.push(nb);all();$('#editor').children[k==='sum'?1:blocks.length-1]?.scrollIntoView({block:'nearest'})};
$('#editor').addEventListener('input',e=>{
 const d=e.target.dataset;if(d.i===undefined||d.up!==undefined)return;
 if(d.hv!==undefined){const bb=blocks[d.i];if(!bb.hv)bb.hv=Array.from({length:cols(bb)},()=>'');bb.hv[d.hv]=e.target.value;paper();return}
 if(d.r!==undefined){blocks[d.i].g[d.r][d.c]=e.target.value;paper();return}
 const v=e.target.type==='checkbox'?(e.target.checked?1:0):e.target.value;
 if(d.j!==undefined)blocks[d.i].p[d.j].c=v;else blocks[d.i][d.k]=d.k==='cols'?+v:v;
 if(d.k==='body'&&blocks[d.i].t==='text'){const c=$('#hdc'+d.i);if(c)c.innerHTML=hdInputs(blocks[d.i],d.i)}
 paper();
});
$('#editor').addEventListener('change',e=>{if(e.target.dataset.up!==undefined&&e.target.files.length){upload(+e.target.dataset.up,e.target.files);e.target.value=''}});
$('#editor').addEventListener('paste',e=>{
 const d=e.target.dataset;if(d.r===undefined)return;
 const t=(e.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(t.replace(/\n+$/,'')))return;
 e.preventDefault();const g=blocks[d.i].g,r0=+d.r,c0=+d.c;
 const rows=t.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(l=>l.split('\t'));
 rows.forEach((row,y)=>{while(g.length<=r0+y)g.push(g[0].map(()=>''));row.forEach((v,x)=>{while(g[0].length<=c0+x)g.forEach(q=>q.push(''));g[r0+y][c0+x]=v})});
 all();
});
$('#editor').addEventListener('click',e=>{
 const t=e.target.closest('button[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i,j=+t.dataset.j;
 const mv=(arr,x,y)=>{if(y>=0&&y<arr.length)[arr[x],arr[y]]=[arr[y],arr[x]]};
 if(a==='del')blocks.splice(i,1);
 const bk=blocks[i];
 if(a==='gadd')bk.g=[['','',''],['','',''],['','','']];
 if(a==='gr+')bk.g.push(bk.g[0].map(()=>''));
 if(a==='gr-'&&bk.g.length>1)bk.g.pop();
 if(a==='gc+')bk.g.forEach(r=>r.push(''));
 if(a==='gc-'&&bk.g[0].length>1)bk.g.forEach(r=>r.pop());
 if(a==='gdel')delete bk.g;
 if(a==='gc+'&&bk.hv)bk.hv.push('');
 if(a==='gc-'&&bk.hv&&bk.g&&bk.g[0].length<bk.hv.length)bk.hv.pop();
 if(a==='hc+'||a==='hc-'){if(!bk.hv)bk.hv=Array.from({length:cols(bk)},()=>'');if(a==='hc+')bk.hv.push('');else if(bk.hv.length>1)bk.hv.pop();bk.hn=1}
 if(a==='up')mv(blocks,i,i-1);if(a==='dn')mv(blocks,i,i+1);
 if(a==='pup')mv(blocks[i].p,j,j-1);if(a==='pdn')mv(blocks[i].p,j,j+1);
 if(a==='pdel')blocks[i].p.splice(j,1);
 all();
});
$('#print').onclick=()=>window.print();
$('#newr').onclick=()=>{if(confirm('Mulai laporan baru? Isi laporan sekarang akan hilang.')){blocks=[{t:'title',title:'Warehouse Daily Report',sub:'Tanggal: '+today()}];all()}};
$('#clrp').onclick=()=>{if(confirm('Hapus semua foto di laporan ini? Tabel dan teks tetap ada.')){blocks.forEach(b=>{if(b.p)b.p=[]});all()}};
const conv=b=>b.t==='sec'?{t:'text',h:b.h}:b.t==='sub'?{t:'text',h:b.h,plain:1}:b.t==='table'?{t:'text',num:b.num,body:/\t/.test(b.rows||'')?b.rows:String(b.rows||'').replace(/,/g,'\t')}:b;
(async()=>{const s=await load();blocks=Array.isArray(s)&&s.length?s.map(conv).map(b=>{if(b.t==='text'&&b.hd&&!b.hv)b.hv=String(b.hd).split(/[,\t]/).map(x=>x.trim());if(b.t==='text'&&b.hv&&!b.hn){const n=cols(b);b.hv=Array.from({length:Math.max(n,b.hv.length)},(_,x)=>b.hv[x]||'')}return b}).filter(b=>TYPES[b.t]):SAMPLE();if(!blocks.length||blocks[0].t!=='title')blocks.unshift({t:'title',title:'Warehouse Daily Report',sub:'Tanggal: '+today()});all()})();
</script>
</body>
