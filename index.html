<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse Report Builder</title>
<style>
:root{--bg:#eef0f3;--panel:#fff;--ink:#1c2433;--mute:#667085;--line:#d8dce3;--acc:#2f9e33;--accbg:#e8f5e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--panel:#1d232d;--ink:#e8ebf0;--mute:#9aa3b2;--line:#323a47;--acc:#4cc152;--accbg:#223a26}}
:root[data-theme="dark"]{--bg:#14181f;--panel:#1d232d;--ink:#e8ebf0;--mute:#9aa3b2;--line:#323a47;--acc:#4cc152;--accbg:#223a26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:400px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
.side h1{font-size:16px;margin:0 0 4px}
.side p{margin:0 0 12px;color:var(--mute);font-size:12.5px}
.add{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px;display:inline-block}
button:hover,.btn:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);width:100%;padding:10px;font-weight:600;margin-bottom:6px}
.tools{display:flex;gap:6px;margin-bottom:14px}.tools button{flex:1;font-size:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.card header{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.card header b{flex:1;font-size:12.5px;color:var(--acc)}
.card header button{padding:2px 8px;font-size:12px}
label{display:block;font-size:11.5px;color:var(--mute);margin:6px 0 2px}
label.ck{display:flex;gap:6px;align-items:center;color:var(--ink)}
input[type=text],textarea,select{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.ph{display:grid;grid-template-columns:48px 1fr auto;gap:6px;align-items:center;margin-top:6px}
.ph img{width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.ph div{display:flex;gap:2px}.ph button{padding:2px 6px;font-size:12px}
.gr{overflow:auto;margin-top:6px}.gr table{border-collapse:collapse}.gr td{padding:0}.gr input[type=text]{width:112px;padding:3px 5px;font-size:12px;border-radius:0}.gr tr:first-child input{font-weight:700}.gb{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.gb button{padding:2px 8px;font-size:12px}
.st{font-size:12px;color:var(--mute);margin-top:4px}
.stage{padding:24px;overflow:auto}
.paper{width:210mm;max-width:100%;min-height:297mm;margin:0 auto;background:#fff;color:#111;padding:14mm 15mm;box-shadow:0 2px 14px rgba(0,0,0,.2);font:12px/1.45 Arial,Helvetica,sans-serif}
.paper .hd{background:#e3f0e0;border-left:6px solid #2f9e33;border-radius:0 6px 6px 0;padding:16px 20px;margin-bottom:20px}
.paper h1{font-size:27px;font-weight:800;letter-spacing:-.01em;color:#1f7a24;margin:0;line-height:1.15}
.paper .sub{font-size:13px;font-weight:700;color:#3a4a3a;margin:6px 0 0}
.paper h2{font-size:15px;font-weight:700;margin:22px 0 8px;padding:7px 12px;background:#edf5ea;border-left:4px solid #2f9e33;border-radius:0 4px 4px 0;color:#1c2433;break-after:avoid}
.paper h3{font-size:13px;font-weight:700;margin:16px 0 6px;padding:5px 10px;background:#f4f9f2;border-left:3px solid #8fc58f;border-radius:0 4px 4px 0;color:#1f6b24;break-after:avoid}
.paper p{margin:6px 0;white-space:pre-wrap;color:#222;line-height:1.55}
.paper table{border-collapse:collapse;width:100%;margin:6px 0 10px}
.paper th,.paper td{border:1px solid #d9e0d8;padding:5px 9px;text-align:left;vertical-align:top;font-size:11.5px}
.paper th{background:#2a8a2e;color:#fff;font-weight:700}
.paper tbody tr:nth-child(even){background:#eff7ec}
.paper tr{break-inside:avoid}
.note{background:#fff8e1;border:1px solid #f0b400;border-left-width:3px;padding:8px 12px;margin:10px 0;break-inside:avoid}
.note b.t{display:block;color:#8a5a00;margin-bottom:4px;font-size:12.5px}
.cap{font-size:12px;font-weight:700;margin:16px 0 6px;padding:5px 10px;background:#f4f9f2;border-left:3px solid #8fc58f;border-radius:0 4px 4px 0;color:#1c2433;break-after:avoid}
.grid{display:grid;border-top:1px solid #d5d9d5;border-left:1px solid #d5d9d5;margin-bottom:10px}
.cell{background:#fafcf9;border-right:1px solid #d9e0d8;border-bottom:1px solid #d9e0d8;padding:8px 6px 6px;text-align:center;break-inside:avoid;display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:6px}
.cell img{max-width:100%;max-height:62mm;object-fit:contain;display:block}
.cell.w img{max-height:150mm}
.cell span{font-size:10px;color:#444}
.empty{color:#999;font-style:italic}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.stage{padding:10px}.paper{padding:8mm}}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff}.side{display:none}.app{display:block}
 .stage{padding:0;overflow:visible}
 .paper{box-shadow:none;width:auto;min-height:0;margin:0;padding:0}
 :root{padding:0}
}
</style>
<style id="pg">@page{size:A4;margin:14mm 15mm 18mm}</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <h1>Warehouse Report Builder</h1>
  <p>Susun laporan dari blok, upload foto, lalu simpan jadi PDF. Isi laporan otomatis tersimpan di browser ini.</p>
  <button class="pri" id="print">Simpan sebagai PDF</button>
  <div class="st" style="margin-bottom:12px">Di dialog print: pilih "Save as PDF", matikan "Headers and footers". Kalau tombol tidak jalan, tekan Ctrl+P.</div>
  <div class="add" id="add"></div>
  <div class="tools"><button id="newr">Laporan baru</button><button id="clrp">Hapus semua foto</button></div>
  <div id="editor"></div>
 </aside>
 <main class="stage"><article class="paper" id="paper"></article></main>
</div>
<script>
const TYPES={
 title:{n:'Judul & tanggal',f:[['title','Judul','i'],['sub','Tanggal','i']]},
 text:{n:'Laporan tulisan',f:[['h','Judul bagian','i'],['body','Isi tulisan (**tebal** pakai dua bintang). Untuk tabel pakai tombol Tambah tabel di bawah','t'],['hd','Judul kolom tabel (opsional, pisahkan pakai koma). Contoh: Nama Lokasi, Terminal ID, SIM Card','i']],ck:[['plain','Tanpa nomor (untuk sub-judul)'],['num','Tabel: tambah kolom No otomatis'],['nohead','Tabel: tanpa baris header (semua baris = data)']]},
 note:{n:'Catatan tambahan',f:[['h','Judul kotak','i'],['body','Isi (**tebal** pakai dua bintang)','t']]},
 photos:{n:'Laporan foto',f:[['h','Judul lampiran','i']],photos:1}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const today=()=>{try{return new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}};
const SAMPLE=()=>[
 {t:'title',title:'Warehouse Daily Report',sub:'Tanggal: '+today()},
 {t:'text',h:'QC Mesin Withdrawal',num:1,body:'Nama Lokasi\tTerminal ID\tStatus\nHalte Transjakarta - Tosari\tnas_0053111600000140\tAvailable\nHalte Transjakarta - Pinang Ranti\tnas_0053111600000146\tAvailable\nCinepolis Pejaten Village\tnas_0023211600000057\tAvailable'},
 {t:'text',h:'Incoming Rangka - Status Pass',body:'Semua unit sudah dicek hari ini.'},
 {t:'text',h:'Rangka 1',plain:1,num:1,body:'Poin Pengecekan\tHasil\nBaut bagian atas\tPass\nFan normal\tPass'},
 {t:'note',h:'CATATAN MINOR',body:'2 lubang kabel di box mesin **terlalu kecil**. Akan diperbesar paling lambat **besok** oleh **tim KPM**.'},
 {t:'photos',h:'Lampiran Foto - Rangka 1',cols:3,p:[]}
];
let blocks=[];

/* storage: IndexedDB (muat banyak foto), semua dibungkus try/catch */
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((ok,no)=>{try{const r=indexedDB.open('wrb',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});return dbp}
async function save(){try{const d=await db();d.transaction('s','readwrite').objectStore('s').put(blocks,'blocks')}catch(e){}}
async function load(){try{const d=await db();return await new Promise(ok=>{const r=d.transaction('s').objectStore('s').get('blocks');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}}

function cells(l){return l.includes('\t')?l.split('\t'):l.split(',')}
const hdArr=b=>String(b.hd||'').split(/[,\t]/).map(x=>x.trim()).filter(Boolean);
function tbl(r,num,nh,hd){
 const H=hd&&hd.length?hd:null;nh=nh||r.length===1;
 const head=H||(nh?null:r[0]),rows=(H||nh)?r:r.slice(1);
 const th=head?'<thead><tr>'+(num?'<th style="width:36px">No</th>':'')+head.map(c=>`<th>${esc(c.trim())}</th>`).join('')+'</tr></thead>':'';
 const tb=rows.map((x,i)=>`<tr>${num?`<td>${i+1}</td>`:''}${x.map(c=>`<td>${esc(c.trim())}</td>`).join('')}</tr>`).join('');
 return `<table>${th}<tbody>${tb}</tbody></table>`;
}
function bodyHtml(b){
 let out='',para=[],tb=[];
 const fp=()=>{if(para.length){out+=`<p>${rich(para.join('\n'))}</p>`;para=[]}};
 const ft=()=>{if(tb.length){out+=tbl(tb,b.num,b.nohead,hdArr(b));tb=[]}};
 for(const l of String(b.body||'').split('\n')){
  const t=l.trim();
  if(l.includes('\t')||/ \| /.test(l)){fp();tb.push(l.includes('\t')?l.split('\t'):l.split('|'))}
  else if(!t){fp();ft()}
  else{ft();para.push(t)}
 }
 fp();ft();return out;
}
function renderBlock(b,ctx){
 if(b.t==='title')return `<div class="hd"><h1>${esc(b.title)||'Judul laporan'}</h1><div class="sub">${esc(b.sub)}</div></div>`;
 if(b.t==='text'){
  let hd='';
  if(b.h){if(b.plain)hd=`<h3>${esc(b.h)}</h3>`;else{ctx.n++;hd=`<h2>${ctx.n}. ${esc(b.h)}</h2>`}}
  return hd+(bodyHtml(b)||(b.g||b.h?'':'<p class="empty">Laporan kosong</p>'))+(b.g?tbl(b.g,b.num,b.nohead,hdArr(b)):'');
 }
 if(b.t==='note')return `<div class="note"><b class="t">${esc(b.h)}</b>${rich(b.body)}</div>`;
 if(b.t==='photos'){
  const p=b.p||[],c=b.cols||3;
  return (b.h?`<div class="cap">${esc(b.h)}</div>`:'')+(p.length?`<div class="grid" style="grid-template-columns:repeat(${c},1fr)">${p.map(x=>`<div class="cell${c==1?' w':''}"><img src="${x.s}" alt="${esc(x.c)}"><span>${esc(x.c)}</span></div>`).join('')}</div>`:'<p class="empty">Belum ada foto, upload dari panel kiri</p>');
 }
 return '';
}
function paper(){
 const ctx={n:0};$('#paper').innerHTML=blocks.map(b=>renderBlock(b,ctx)).join('');
 const t=blocks.find(b=>b.t==='title');
 const ft=((t&&t.title)||'Laporan')+' - '+((t&&t.sub)||'').replace(/^Tanggal:\s*/,'');
 $('#pg').textContent=`@page{size:A4;margin:14mm 15mm 18mm;@bottom-left{content:"${ft.replace(/["\\\n]/g,' ')}";font:9pt Arial;color:#888}@bottom-right{content:"Hal. " counter(page);font:9pt Arial;color:#888}}`;
 save();
}
function gridEd(b,i){
 if(!b.g)return `<div class="gb"><button data-a="gadd" data-i="${i}">+ Tambah tabel</button></div>`;
 const rows=b.g.map((r,y)=>`<tr>${r.map((c,x)=>`<td><input type="text" data-i="${i}" data-r="${y}" data-c="${x}" value="${esc(c)}" aria-label="Baris ${y+1} kolom ${x+1}"></td>`).join('')}</tr>`).join('');
 return `<label>Tabel (baris pertama = header, kecuali Judul kolom di atas diisi). Bisa paste langsung dari Excel/Sheets ke sel mana pun</label><div class="gr"><table>${rows}</table></div><div class="gb"><button data-a="gr+" data-i="${i}">+ Baris</button><button data-a="gr-" data-i="${i}">− Baris</button><button data-a="gc+" data-i="${i}">+ Kolom</button><button data-a="gc-" data-i="${i}">− Kolom</button><button data-a="gdel" data-i="${i}">Hapus tabel</button></div>`;
}
function editor(){
 $('#editor').innerHTML=blocks.map((b,i)=>{
  const T=TYPES[b.t];
  let h=T.f.map(([k,l,kind])=>`<label>${l}</label>`+(kind==='t'?`<textarea data-i="${i}" data-k="${k}">${esc(b[k])}</textarea>`:`<input type="text" data-i="${i}" data-k="${k}" value="${esc(b[k])}">`)).join('');
  if(b.t==='text')h+=gridEd(b,i);
  if(T.ck)h+=T.ck.map(([k,l])=>`<label class="ck"><input type="checkbox" data-i="${i}" data-k="${k}" ${b[k]?'checked':''}> ${l}</label>`).join('');
  if(T.photos){
   h+=`<label>Jumlah kolom foto</label><select data-i="${i}" data-k="cols">${[1,2,3,4].map(n=>`<option ${(b.cols||3)==n?'selected':''}>${n}</option>`).join('')}</select>`;
   h+=`<label>Upload foto (bisa pilih banyak sekaligus)</label><input type="file" accept="image/*" multiple data-up="${i}"><div class="st" id="st${i}">${(b.p||[]).length} foto</div>`;
   h+=(b.p||[]).map((x,j)=>`<div class="ph"><img src="${x.s}" alt=""><input type="text" data-i="${i}" data-j="${j}" value="${esc(x.c)}"><div><button data-a="pup" data-i="${i}" data-j="${j}" aria-label="Naik">↑</button><button data-a="pdn" data-i="${i}" data-j="${j}" aria-label="Turun">↓</button><button data-a="pdel" data-i="${i}" data-j="${j}" aria-label="Hapus foto">✕</button></div></div>`).join('');
  }
  return `<section class="card"><header><b>${T.n}</b>${b.t==='title'?'':`<button data-a="up" data-i="${i}" aria-label="Naik">↑</button><button data-a="dn" data-i="${i}" aria-label="Turun">↓</button><button data-a="del" data-i="${i}" aria-label="Hapus blok">✕</button>`}</header>${h}</section>`}).join('')||'<p>Belum ada blok.</p>';
}
function all(){editor();paper()}

/* foto: perkecil dulu supaya PDF dan penyimpanan tidak berat */
function shrink(file){return new Promise(ok=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1100,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.78))};im.onerror=()=>{URL.revokeObjectURL(u);ok(null)};im.src=u})}
async function upload(i,files){
 const b=blocks[i];b.p=b.p||[];const fs=[...files].sort((a,c)=>a.name.localeCompare(c.name,undefined,{numeric:true}));
 for(let n=0;n<fs.length;n++){
  const st=$('#st'+i);if(st)st.textContent=`Memproses ${n+1}/${fs.length}...`;
  const s=await shrink(fs[n]);if(s)b.p.push({s,c:fs[n].name.replace(/\.[^.]+$/,'')});
 }
 all();
}

$('#add').innerHTML=Object.entries(TYPES).filter(([k])=>k!=='title').map(([k,v])=>`<button data-add="${k}">+ ${v.n}</button>`).join('');
$('#add').onclick=e=>{const k=e.target.dataset.add;if(!k)return;blocks.push(k==='photos'?{t:k,cols:3,p:[]}:{t:k});all();$('#editor').lastElementChild?.scrollIntoView({block:'nearest'})};
$('#editor').addEventListener('input',e=>{
 const d=e.target.dataset;if(d.i===undefined||d.up!==undefined)return;
 if(d.r!==undefined){blocks[d.i].g[d.r][d.c]=e.target.value;paper();return}
 const v=e.target.type==='checkbox'?(e.target.checked?1:0):e.target.value;
 if(d.j!==undefined)blocks[d.i].p[d.j].c=v;else blocks[d.i][d.k]=d.k==='cols'?+v:v;
 paper();
});
$('#editor').addEventListener('change',e=>{if(e.target.dataset.up!==undefined&&e.target.files.length){upload(+e.target.dataset.up,e.target.files);e.target.value=''}});
$('#editor').addEventListener('paste',e=>{
 const d=e.target.dataset;if(d.r===undefined)return;
 const t=(e.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(t.replace(/\n+$/,'')))return;
 e.preventDefault();const g=blocks[d.i].g,r0=+d.r,c0=+d.c;
 const rows=t.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(l=>l.split('\t'));
 rows.forEach((row,y)=>{while(g.length<=r0+y)g.push(g[0].map(()=>''));row.forEach((v,x)=>{while(g[0].length<=c0+x)g.forEach(q=>q.push(''));g[r0+y][c0+x]=v})});
 all();
});
$('#editor').addEventListener('click',e=>{
 const t=e.target.closest('button[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i,j=+t.dataset.j;
 const mv=(arr,x,y)=>{if(y>=0&&y<arr.length)[arr[x],arr[y]]=[arr[y],arr[x]]};
 if(a==='del')blocks.splice(i,1);
 const bk=blocks[i];
 if(a==='gadd')bk.g=[['','',''],['','',''],['','','']];
 if(a==='gr+')bk.g.push(bk.g[0].map(()=>''));
 if(a==='gr-'&&bk.g.length>1)bk.g.pop();
 if(a==='gc+')bk.g.forEach(r=>r.push(''));
 if(a==='gc-'&&bk.g[0].length>1)bk.g.forEach(r=>r.pop());
 if(a==='gdel')delete bk.g;
 if(a==='up')mv(blocks,i,i-1);if(a==='dn')mv(blocks,i,i+1);
 if(a==='pup')mv(blocks[i].p,j,j-1);if(a==='pdn')mv(blocks[i].p,j,j+1);
 if(a==='pdel')blocks[i].p.splice(j,1);
 all();
});
$('#print').onclick=()=>window.print();
$('#newr').onclick=()=>{if(confirm('Mulai laporan baru? Isi laporan sekarang akan hilang.')){blocks=[{t:'title',title:'Warehouse Daily Report',sub:'Tanggal: '+today()}];all()}};
$('#clrp').onclick=()=>{if(confirm('Hapus semua foto di laporan ini? Tabel dan teks tetap ada.')){blocks.forEach(b=>{if(b.p)b.p=[]});all()}};
const conv=b=>b.t==='sec'?{t:'text',h:b.h}:b.t==='sub'?{t:'text',h:b.h,plain:1}:b.t==='table'?{t:'text',num:b.num,body:/\t/.test(b.rows||'')?b.rows:String(b.rows||'').replace(/,/g,'\t')}:b;
(async()=>{const s=await load();blocks=Array.isArray(s)&&s.length?s.map(conv).filter(b=>TYPES[b.t]):SAMPLE();if(!blocks.length||blocks[0].t!=='title')blocks.unshift({t:'title',title:'Warehouse Daily Report',sub:'Tanggal: '+today()});all()})();
</script>
</body>
</html>
